<title>ESC:APE</title>
<style>
html,body{margin:0;padding:0;background:#050506;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,177.78vh);aspect-ratio:16/9;background:#0b0b0d;cursor:crosshair;touch-action:none;user-select:none}
</style>
<canvas id="cv" width="960" height="540"></canvas>
<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=960,H=540;
const GRAV=2300,MOVE=300,JUMPV=780;
const F_KR='"Malgun Gothic","Apple SD Gothic Neo",sans-serif';
const F_MONO='Consolas,"Courier New",monospace';
const F_DISP='"Arial Black","Malgun Gothic",sans-serif';
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const xov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x;
const fadeIn=(t,s,d)=>clamp((t-s)/d,0,1);

// ---------- audio ----------
let AC=null,sfxGain=null,lastTick=0;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    sfxGain=AC.createGain();sfxGain.connect(AC.destination);
  }catch(e){}
}
function beep(f0,dur,type,vol,f1){
  if(!AC)return;
  try{
    const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f0,t0);
    if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
    g.gain.setValueAtTime(vol||0.2,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(sfxGain);o.start(t0);o.stop(t0+dur+0.02);
  }catch(e){}
}
const sJump=()=>beep(300,0.1,'square',0.12,440);
const sLand=()=>beep(170,0.05,'triangle',0.08);
const sDeath=()=>beep(180,0.55,'sawtooth',0.28,55);
const sThud=()=>beep(110,0.14,'triangle',0.3,70);
const sClick=()=>beep(950,0.04,'square',0.1);
const sChime=()=>{beep(660,0.12,'sine',0.15);setTimeout(()=>beep(880,0.2,'sine',0.15),110);};
const sCollapse=()=>beep(90,0.6,'sawtooth',0.3,35);
const sDrop=()=>{beep(420,0.35,'square',0.2,70);};
const sBuzz=()=>beep(105,0.18,'square',0.15);
function sTick(){const n=performance.now();if(n-lastTick>50){lastTick=n;beep(900,0.02,'square',0.05);}}

// ---------- rooms ----------
const WALLS=[{x:-40,y:-100,w:40,h:740},{x:960,y:-100,w:40,h:740},{x:0,y:-40,w:960,h:40}];
const ROOMS=[
 { // 0: 보이지 않는 출구
  spawn:{x:90,y:438},
  solids:[{x:0,y:470,w:620,h:70},{x:860,y:470,w:100,h:70},...WALLS],
  trap:{x:620,y:470,w:240,h:70},
  spikes:[{x:620,y:520,w:240,h:20}],
  fires:[],
  door:{x:878,y:398,w:42,h:72,hidden:true},
 },
 { // 1: 실패로 만든 다리
  spawn:{x:80,y:438},
  solids:[{x:0,y:470,w:260,h:70},{x:700,y:470,w:260,h:70},...WALLS],
  spikes:[{x:260,y:522,w:440,h:18}],
  fires:[],
  door:{x:886,y:398,w:42,h:72},
 },
 { // 2: 사망 원인 삭제
  spawn:{x:80,y:438},
  solids:[{x:0,y:470,w:960,h:70},...WALLS],
  spikes:[],
  fires:[{x:420,y:330,w:260,h:140}],
  door:{x:886,y:398,w:42,h:72},
 },
];
const MENU_BTNS=[
 {x:110,y:396,w:230,h:52,label:'CONTINUE',broken:true},
 {x:430,y:330,w:230,h:52,label:'SETTINGS',broken:true},
 {x:200,y:240,w:200,h:48,label:'CREDITS',broken:true},
 {x:620,y:424,w:250,h:60,label:'EXIT GAME',broken:false},
];
const MENU_SOLIDS=[{x:0,y:500,w:960,h:40},...MENU_BTNS,...WALLS];

// ---------- panel(설정 창) ----------
const PW=330,PH=292;
const SL=[
 {key:'bri',label:'밝기 · BRIGHTNESS',min:0.05,max:1,fmt:v=>Math.round(v*100)+'%'},
 {key:'sfx',label:'효과음 · SFX',min:0,max:1,fmt:v=>Math.round(v*100)+'%'},
 {key:'ui',label:'UI 크기 · UI SCALE',min:1,max:3,fmt:v=>v.toFixed(1)+'×'},
];
const rowY=i=>S.py+40+i*52;
const trackX=()=>S.px+16,trackW=()=>PW-32;
const zoneRect=()=>({x:S.px+14,y:S.py+214,w:PW-28,h:66});

// ---------- state ----------
let S,state,roomIdx,rs,p,dd,fails,r0,deaths,startTime,particles,trans,drag,mouse,
    everOpened,menuT,outroT,confirmOpen,shake,toastO,keys,gameT;

function init(){
  S={bri:0.35,sfx:0.7,ui:1,open:false,px:596,py:64,disabled:new Set()};
  state='play';roomIdx=0;deaths=0;startTime=performance.now();
  fails={0:[],1:[],2:[]};r0={collapsed:false};
  particles=[];trans=null;drag=null;mouse={x:0,y:0};
  everOpened=false;menuT=0;outroT=0;confirmOpen=false;shake=0;gameT=0;
  toastO={t:'',until:0};keys={};dd=null;
  enterRoom(0);
}
function say(t,d){toastO={t,until:gameT+(d||3.5)};}
function room(){return ROOMS[roomIdx];}
function enterRoom(i){
  roomIdx=i;
  if(i>=3){state='menu';menuT=0;p={x:60,y:468,w:24,h:32,vx:0,vy:0,onGround:false,face:1};return;}
  rs={t:0,f:{}};
  const sp=ROOMS[i].spawn;
  p={x:sp.x,y:sp.y,w:24,h:32,vx:0,vy:0,onGround:false,face:1};
  state='play';
  if(i===1)say('절벽. 건너기엔 너무 멀다.',3.5);
  if(i===2)say('불길이 통로를 막고 있다.',3.5);
}
function respawn(){
  const sp=room().spawn;
  p.x=sp.x;p.y=sp.y;p.vx=0;p.vy=0;
}

// ---------- fail objects (YOU DIED) ----------
function failRect(f){const w=f.baseW*S.ui,h=f.baseH*S.ui;return{x:f.x-w/2,y:f.yb-h,w,h};}
function topOf(f){return f.yb-f.baseH*S.ui;}
function findSupport(f){
  const w=f.baseW*S.ui,rect={x:f.x-w/2,w};
  let best=640,bestObj=null;
  const cand=[];
  for(const s of room().solids)cand.push({x:s.x,w:s.w,top:s.y,obj:null});
  if(roomIdx===0&&!r0.collapsed)cand.push({x:ROOMS[0].trap.x,w:ROOMS[0].trap.w,top:ROOMS[0].trap.y,obj:null});
  for(const sp of room().spikes)cand.push({x:sp.x,w:sp.w,top:sp.y,obj:null});
  for(const o of fails[roomIdx]){
    if(o===f||!o.settled)continue;
    const r=failRect(o);cand.push({x:r.x,w:r.w,top:r.y,obj:o});
  }
  for(const c of cand){
    const L=Math.max(rect.x,c.x),R=Math.min(rect.x+rect.w,c.x+c.w);
    if(R-L<16)continue;
    if(c.top>=f.yb-6&&c.top<best){best=c.top;bestObj=c.obj;}
  }
  return{y:best,obj:bestObj};
}
function spawnFail(x,fy){
  const f={x:clamp(x,50,910),yb:fy-14,vy:0,settled:false,baseW:96,baseH:30,stackOn:null,groundY:640};
  const sup=findSupport(f);
  f.groundY=sup.y;f.stackOn=sup.obj;
  fails[roomIdx].push(f);
}
function updateFails(dt){
  if(roomIdx>2)return;
  for(const f of fails[roomIdx]){
    const target=f.stackOn?topOf(f.stackOn):f.groundY;
    if(!f.settled){
      f.vy+=1800*dt;f.yb+=f.vy*dt;
      if(f.yb>=target){f.yb=target;f.settled=true;sThud();shake=Math.max(shake,0.12);}
    }else f.yb=target;
  }
}

// ---------- physics ----------
function solidRects(){
  const arr=[...room().solids];
  if(roomIdx===0&&!r0.collapsed)arr.push(ROOMS[0].trap);
  return arr;
}
function oneWayRects(){
  const arr=[];
  if(roomIdx<=2)for(const f of fails[roomIdx])if(f.settled)arr.push(failRect(f));
  if(S.open&&state==='play')arr.push({x:S.px,y:S.py,w:PW,h:10});
  return arr;
}
function movePlayer(dt,solids,oneways){
  p.x+=p.vx*dt;
  for(const s of solids)if(ov(p,s)){
    if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;
  }
  const prevFoot=p.y+p.h,wasGround=p.onGround;
  p.y+=p.vy*dt;p.onGround=false;
  for(const s of solids)if(ov(p,s)){
    if(p.vy>0){p.y=s.y-p.h;p.vy=0;p.onGround=true;}
    else if(p.vy<0){p.y=s.y+s.h;p.vy=0;}
  }
  for(const o of oneways){
    if(!xov(p,o))continue;
    const foot=p.y+p.h;
    if(p.vy>=0&&prevFoot<=o.y+8&&foot>=o.y){p.y=o.y-p.h;p.vy=0;p.onGround=true;}
    else if(p.vy>=0&&foot>o.y&&foot<o.y+Math.min(40,o.h*0.6)){p.y=o.y-p.h;p.vy=0;p.onGround=true;}
  }
  if(p.onGround&&!wasGround&&p.vy===0)sLand();
}
function playerInput(dt){
  p.vx=0;
  if(keys.ArrowLeft||keys.KeyA){p.vx=-MOVE;p.face=-1;}
  if(keys.ArrowRight||keys.KeyD){p.vx=MOVE;p.face=1;}
  if((keys.Space||keys.ArrowUp||keys.KeyW)&&p.onGround){p.vy=-JUMPV;p.onGround=false;sJump();}
  p.vy+=GRAV*dt;p.vy=Math.min(p.vy,1200);
}

// ---------- death ----------
function death(cause){
  if(state!=='play')return;
  deaths++;sDeath();shake=0.4;
  const cw=cause==='FIRE'?96:90;
  dd={cause,fx:p.x+p.w/2,fy:p.y+p.h,t:0,first:deaths===1,
      retry:{x:480,y:358},retryHome:{x:480,y:358},
      causeP:{x:508,y:272},causeHome:{x:508,y:272},causeW:cw,
      dropped:S.disabled.has(cause)};
  if(cause==='FIRE'&&!S.disabled.has('FIRE'))S.open=true;
  state='dead';
}
function doRetry(){
  if(!dd)return;
  sClick();
  spawnFail(dd.fx,dd.fy);
  dd=null;state='play';respawn();
  if(roomIdx===1){
    const n=fails[1].length;
    if(n===1)say('실패가 그 자리에 남았습니다.',4);
    else if(n===2&&S.ui<2)say('ESC — UI 크기 슬라이더를 움직여 보세요.',4.5);
  }
}
function dropCause(){
  S.disabled.add(dd.cause);dd.dropped=true;sDrop();shake=0.3;
  say('단어가 세계를 이루고 있었습니다.',4.5);
}

// ---------- update ----------
function update(dt){
  gameT+=dt;shake=Math.max(0,shake-dt*1.6);
  if(sfxGain)sfxGain.gain.value=S.sfx*S.sfx*0.9;
  for(let i=particles.length-1;i>=0;i--){
    const q=particles[i];q.vy+=2000*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
    if(q.life<=0)particles.splice(i,1);
  }
  if(trans){
    trans.t+=dt;
    if(trans.t>=trans.dur/2&&!trans.fired){trans.fired=true;trans.cb();}
    if(trans.t>=trans.dur)trans=null;
  }
  if(state==='play')updatePlay(dt);
  else if(state==='dead'){dd.t+=dt;updateFails(dt);}
  else if(state==='menu'){
    menuT+=dt;
    if(!confirmOpen){playerInput(dt);movePlayer(dt,MENU_SOLIDS,[]);}
    if(menuT>4&&!keys._menuHint){keys._menuHint=1;say('버튼이 모두 부서져 있다. EXIT GAME만 아직 빛난다.',4.5);}
  }
  else if(state==='outro')outroT+=dt;
}
function updatePlay(dt){
  rs.t+=dt;
  playerInput(dt);
  movePlayer(dt,solidRects(),oneWayRects());
  updateFails(dt);
  // 함정 붕괴
  if(roomIdx===0&&!r0.collapsed){
    const cx=p.x+p.w/2,foot=p.y+p.h;
    if(cx>625&&cx<855&&foot>430){
      r0.collapsed=true;sCollapse();shake=0.55;
      for(let i=0;i<10;i++)particles.push({x:640+Math.random()*200,y:475+Math.random()*40,
        vx:(Math.random()-0.5)*160,vy:-Math.random()*120,life:0.9,s:4+Math.random()*8});
    }
  }
  // 위험 요소
  if(trans)return;
  for(const sp of room().spikes)if(ov(p,sp)){death('FALL');return;}
  if(!S.disabled.has('FIRE'))for(const f of room().fires)if(ov(p,f)){death('FIRE');return;}
  if(p.y>H+60){death('FALL');return;}
  // 문
  const d=room().door;
  const usable=roomIdx!==0||S.bri>=0.85;
  if(usable&&ov(p,d)){
    sChime();
    const next=roomIdx+1;
    trans={t:0,dur:0.8,fired:false,cb:()=>enterRoom(next)};
    return;
  }
  // 룸 스크립트
  if(roomIdx===0){
    if(rs.t>9&&!rs.f.h1){rs.f.h1=1;say('막혔다면, 잠시 쉬어도 괜찮습니다.',4);}
    if(rs.t>15&&!rs.f.h2&&!everOpened){rs.f.h2=1;say('…… ( ESC )',5);}
    if(S.bri>=0.85&&!rs.f.rev){rs.f.rev=1;sChime();say('벽에 숨어 있던 문이 나타났다.',3.5);}
  }
  if(roomIdx===1){
    if(S.ui>2.4&&fails[1].length>=2&&!rs.f.big){rs.f.big=1;say('실패를 크게 보면, 길이 되기도 합니다.',5);}
  }
}

// ---------- input ----------
addEventListener('keydown',e=>{
  initAudio();
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='ArrowDown')e.preventDefault();
  if(e.code==='Escape'){
    e.preventDefault();
    if(state==='play'||state==='dead'){
      S.open=!S.open;everOpened=true;sClick();
    }else if(state==='menu'){
      if(confirmOpen){confirmOpen=false;sClick();}
      else{sBuzz();say('설정이 응답하지 않습니다.',2.5);}
    }
    return;
  }
  keys[e.code]=true;
  if(state==='dead'&&dd&&dd.t>0.6&&(e.code==='Space'||e.code==='Enter'||e.code==='KeyR'))doRetry();
  else if(state==='play'&&e.code==='KeyR'){respawn();sClick();}
  else if(state==='outro'&&e.code==='KeyR'&&outroT>10)init();
});
addEventListener('keyup',e=>{keys[e.code]=false;});

function toGame(e){
  const r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
}
function inR(m,r){return m.x>=r.x&&m.x<=r.x+r.w&&m.y>=r.y&&m.y<=r.y+r.h;}
function retryRect(){return{x:dd.retry.x-75,y:dd.retry.y-23,w:150,h:46};}
function causeRect(){return{x:dd.causeP.x-dd.causeW/2,y:dd.causeP.y-19,w:dd.causeW,h:38};}
function setSlider(sl,mx){
  const v=clamp((mx-trackX())/trackW(),0,1)*(sl.max-sl.min)+sl.min;
  if(Math.abs(v-S[sl.key])>0.001){S[sl.key]=v;sTick();}
}

cv.addEventListener('mousedown',e=>{
  initAudio();
  const m=toGame(e);mouse=m;
  if(state==='outro'){if(outroT>10)init();return;}
  if(state==='menu'){
    if(confirmOpen){
      if(inR(m,{x:335,y:280,w:120,h:44})){sClick();confirmOpen=false;state='outro';outroT=0;}
      else if(inR(m,{x:505,y:280,w:120,h:44})){sClick();confirmOpen=false;say('……정말요?',2.5);}
      return;
    }
    const b=MENU_BTNS[3];
    if(inR(m,b)){sClick();confirmOpen=true;}
    else for(const bb of MENU_BTNS)if(bb.broken&&inR(m,bb))sBuzz();
    return;
  }
  if(S.open){
    const bar={x:S.px,y:S.py,w:PW,h:30};
    if(inR(m,{x:S.px+PW-30,y:S.py,w:30,h:30})){S.open=false;sClick();return;}
    if(inR(m,bar)){drag={type:'panel',dx:m.x-S.px,dy:m.y-S.py};return;}
    for(let i=0;i<SL.length;i++){
      if(inR(m,{x:trackX()-10,y:rowY(i)+20,w:trackW()+20,h:26})){
        drag={type:'slider',i};setSlider(SL[i],m.x);return;
      }
    }
    if(inR(m,{x:S.px,y:S.py,w:PW,h:PH}))return;
  }
  if(state==='dead'&&dd){
    if(dd.cause==='FIRE'&&!dd.dropped&&inR(m,causeRect())){drag={type:'cause'};return;}
    if(inR(m,retryRect())){drag={type:'retry',moved:false,sx:m.x,sy:m.y,dx:m.x-dd.retry.x,dy:m.y-dd.retry.y};return;}
  }
});
addEventListener('mousemove',e=>{
  const m=toGame(e);mouse=m;
  if(!drag)return;
  if(drag.type==='panel'){
    S.px=clamp(m.x-drag.dx,-PW+80,W-80);
    S.py=clamp(m.y-drag.dy,4,H-40);
  }else if(drag.type==='slider')setSlider(SL[drag.i],m.x);
  else if(drag.type==='cause'){dd.causeP.x=m.x;dd.causeP.y=m.y;}
  else if(drag.type==='retry'){
    if(Math.hypot(m.x-drag.sx,m.y-drag.sy)>6)drag.moved=true;
    dd.retry.x=m.x-drag.dx;dd.retry.y=m.y-drag.dy;
  }
});
addEventListener('mouseup',e=>{
  const m=toGame(e);mouse=m;
  if(drag){
    if(drag.type==='cause'){
      if(S.open&&inR(m,zoneRect()))dropCause();
      else{dd.causeP.x=dd.causeHome.x;dd.causeP.y=dd.causeHome.y;}
    }else if(drag.type==='retry'&&!drag.moved)doRetry();
  }
  drag=null;
});

// ---------- draw helpers ----------
function txt(t,x,y,size,font,color,align,alpha,spacing){
  ctx.save();
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.fillStyle=color;ctx.font=size+'px '+font;
  ctx.textAlign=align||'center';ctx.textBaseline='middle';
  try{ctx.letterSpacing=(spacing||0)+'px';}catch(e){}
  ctx.fillText(t,x,y);
  try{ctx.letterSpacing='0px';}catch(e){}
  ctx.restore();
}
function box(r,fill,stroke,lw,dash){
  ctx.save();
  if(dash)ctx.setLineDash(dash);
  if(fill){ctx.fillStyle=fill;ctx.fillRect(r.x,r.y,r.w,r.h);}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.strokeRect(r.x+0.5,r.y+0.5,r.w-1,r.h-1);}
  ctx.restore();
}

// ---------- draw ----------
function drawSolid(s){
  ctx.fillStyle='#1d1d21';ctx.fillRect(s.x,s.y,s.w,s.h);
  ctx.fillStyle='#45454d';ctx.fillRect(s.x,s.y,s.w,2);
}
function drawSpikes(sp){
  ctx.fillStyle='#e0342b';
  for(let x=sp.x;x<sp.x+sp.w-2;x+=20){
    ctx.beginPath();
    ctx.moveTo(x,sp.y+sp.h);ctx.lineTo(x+10,sp.y);ctx.lineTo(x+20,sp.y+sp.h);
    ctx.closePath();ctx.fill();
  }
}
function drawFire(f){
  const g=ctx.createLinearGradient(0,f.y,0,f.y+f.h);
  g.addColorStop(0,'rgba(255,70,35,0)');g.addColorStop(1,'rgba(255,60,30,0.35)');
  ctx.fillStyle=g;ctx.fillRect(f.x,f.y,f.w,f.h);
  for(let i=0;i<f.w;i+=22){
    const hh=55+Math.sin(gameT*11+i*0.7)*20+Math.sin(gameT*23+i)*8;
    ctx.fillStyle=i%44?'rgba(255,59,48,0.85)':'rgba(255,122,61,0.8)';
    ctx.beginPath();
    ctx.moveTo(f.x+i,f.y+f.h);
    ctx.lineTo(f.x+i+11,f.y+f.h-hh);
    ctx.lineTo(f.x+i+22,f.y+f.h);
    ctx.closePath();ctx.fill();
  }
}
function drawDoor(d,alpha){
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;
  ctx.fillStyle='#060607';ctx.fillRect(d.x,d.y,d.w,d.h);
  ctx.strokeStyle='#d8d8d2';ctx.lineWidth=2;ctx.strokeRect(d.x,d.y,d.w,d.h);
  ctx.fillStyle='#d8d8d2';ctx.fillRect(d.x+d.w-10,d.y+d.h/2-2,4,4);
  txt('EXIT',d.x+d.w/2,d.y-10,10,F_MONO,'#8a8a92');
  ctx.restore();
}
function drawFailObj(f){
  const r=failRect(f);
  box(r,'#141416',null);
  ctx.save();
  ctx.strokeStyle='#8a8a92';ctx.setLineDash([5,4]);ctx.lineWidth=1;
  ctx.strokeRect(r.x+0.5,r.y+0.5,r.w-1,r.h-1);
  ctx.restore();
  ctx.save();
  ctx.translate(r.x+r.w/2,r.y+r.h/2);
  ctx.font='900 26px '+F_DISP;ctx.textAlign='center';ctx.textBaseline='middle';
  const tw=ctx.measureText('YOU DIED').width;
  const sc=Math.min((r.w-10)/tw,(r.h-6)/30);
  ctx.scale(sc,sc);
  ctx.fillStyle='#ececec';ctx.fillText('YOU DIED',0,1);
  ctx.restore();
}
function drawPlayer(){
  ctx.save();
  ctx.fillStyle='#ececec';
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(p.x,p.y,p.w,p.h,6);ctx.fill();}
  else ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle='#151517';
  const ex=p.x+p.w/2+p.face*5;
  ctx.fillRect(ex-3,p.y+9,3,5);ctx.fillRect(ex+3,p.y+9,3,5);
  ctx.restore();
}
function drawWorld(){
  const R=room();
  for(const s of R.solids)if(s.y<H+40&&s.x<W&&s.x+s.w>0)drawSolid(s);
  if(roomIdx===0){
    if(!r0.collapsed){
      drawSolid(R.trap);
      ctx.strokeStyle='#2c2c31';ctx.lineWidth=1;
      for(let x=650;x<860;x+=48){ctx.beginPath();ctx.moveTo(x,470);ctx.lineTo(x-6,540);ctx.stroke();}
    }else for(const sp of R.spikes)drawSpikes(sp);
  }else for(const sp of R.spikes)drawSpikes(sp);
  if(!S.disabled.has('FIRE'))for(const f of R.fires)drawFire(f);
  else if(roomIdx===2){
    ctx.fillStyle='#131316';
    for(const f of R.fires)ctx.fillRect(f.x,f.y+f.h-6,f.w,6);
  }
  if(!R.door.hidden)drawDoor(R.door);
  for(const f of fails[roomIdx])drawFailObj(f);
  ctx.fillStyle='#55555c';
  for(const q of particles)ctx.fillRect(q.x,q.y,q.s,q.s);
  if(state==='play')drawPlayer();
  // 어둠
  const dark=(1-S.bri)*0.93;
  if(dark>0.01){ctx.fillStyle='rgba(0,0,0,'+dark.toFixed(3)+')';ctx.fillRect(0,0,W,H);}
  // 튜토리얼 안내는 어둠 위에 (항상 읽히도록)
  if(roomIdx===0){
    txt('A / D  이동',110,150,14,F_KR,'#8a8a92','left');
    txt('SPACE  점프',110,175,14,F_KR,'#8a8a92','left');
    txt('출구를 찾으세요 →',110,200,14,F_KR,'#8a8a92','left');
  }
  // 숨겨진 문 + 배너
  if(roomIdx===0){
    const da=clamp((S.bri-0.55)/0.35,0,1);
    if(da>0){
      drawDoor(R.door,da);
      txt('SETTINGS  ARE  PART  OF  THE  GAME',480,140,20,F_MONO,'#d8d8d2','center',da,6);
      ctx.save();ctx.globalAlpha=da*0.6;
      ctx.strokeStyle='#d8d8d2';ctx.beginPath();
      ctx.moveTo(300,158);ctx.lineTo(660,158);ctx.stroke();ctx.restore();
    }
  }
}
function drawPanel(){
  const px=S.px,py=S.py;
  ctx.save();ctx.globalAlpha=0.97;
  box({x:px,y:py,w:PW,h:PH},'#141417','#4b4b55',1.5);
  box({x:px,y:py,w:PW,h:30},'#1e1e24','#4b4b55');
  txt('SETTINGS · settings.cfg',px+12,py+16,12,F_MONO,'#b9b9c2','left');
  txt('×',px+PW-15,py+15,16,F_MONO,'#b9b9c2');
  for(let i=0;i<SL.length;i++){
    const sl=SL[i],y=rowY(i);
    txt(sl.label,px+16,y+12,12,F_KR,'#9a9aa3','left');
    txt(sl.fmt(S[sl.key]),px+PW-16,y+12,12,F_MONO,'#ececec','right');
    ctx.fillStyle='#2a2a30';ctx.fillRect(trackX(),y+28,trackW(),4);
    const fr=(S[sl.key]-sl.min)/(sl.max-sl.min);
    ctx.fillStyle='#8a8a92';ctx.fillRect(trackX(),y+28,trackW()*fr,4);
    ctx.fillStyle='#ececec';
    ctx.beginPath();ctx.arc(trackX()+trackW()*fr,y+30,7,0,7);ctx.fill();
  }
  txt('비활성화된 요소 · DISABLED',px+16,rowY(3)-6,12,F_KR,'#9a9aa3','left');
  const z=zoneRect();
  const hot=drag&&drag.type==='cause'&&inR(mouse,z);
  box(z,'#101013',hot?'#ff3b30':'#6b6b75',hot?2:1,[6,5]);
  if(S.disabled.size===0){
    txt('[ 여기에 놓기 ]',z.x+z.w/2,z.y+z.h/2,14,F_KR,hot?'#ff3b30':'#6b6b75');
  }else{
    let cx=z.x+14;
    for(const c of S.disabled){
      const wch=c.length*13+24;
      box({x:cx,y:z.y+16,w:wch,h:32},'#1a1a1e','#ff3b30');
      txt(c,cx+wch/2,z.y+32,15,F_MONO,'#ff3b30');
      ctx.strokeStyle='#ff3b30';ctx.beginPath();
      ctx.moveTo(cx+8,z.y+32);ctx.lineTo(cx+wch-8,z.y+32);ctx.stroke();
      cx+=wch+10;
    }
  }
  ctx.restore();
}
function drawCauseWord(){
  const pulse=(dd.t>3&&!(drag&&drag.type==='cause'))?1+Math.sin(gameT*6)*0.06:1;
  ctx.save();
  ctx.translate(dd.causeP.x,dd.causeP.y);ctx.scale(pulse,pulse);
  box({x:-dd.causeW/2,y:-19,w:dd.causeW,h:38},'#1a1214','#ff3b30',1.5,[5,4]);
  txt(dd.cause,0,0,24,F_MONO,'#ff3b30');
  ctx.restore();
}
function drawDead(){
  const a=Math.min(1,dd.t/0.5);
  ctx.fillStyle='rgba(6,6,8,'+(0.86*a).toFixed(3)+')';
  ctx.fillRect(0,0,W,H);
  if(a<1)return;
  txt('YOU DIED',480,195,66,F_DISP,'#f0f0ec','center',1,8);
  // Cause 줄
  txt('Cause :',445,272,20,F_MONO,'#77777e','right');
  const hotWord=dd.cause==='FIRE'&&!dd.dropped;
  if(dd.dropped){
    txt(dd.cause,dd.causeHome.x,dd.causeHome.y,22,F_MONO,'#4a4a52');
    ctx.strokeStyle='#ff3b30';ctx.beginPath();
    ctx.moveTo(dd.causeHome.x-38,dd.causeHome.y);ctx.lineTo(dd.causeHome.x+38,dd.causeHome.y);ctx.stroke();
    txt('— 비활성화됨',dd.causeHome.x+120,dd.causeHome.y,14,F_KR,'#77777e');
  }else if(hotWord){
    if(!(drag&&drag.type==='cause'))drawCauseWord();
  }else{
    txt(dd.cause,dd.causeP.x,dd.causeP.y,22,F_MONO,'#ececec');
  }
  // 첫 죽음 — 버튼 뒤 숨은 문구
  if(dd.first){
    txt('실패를 치우지 마세요.',dd.retryHome.x,dd.retryHome.y-9,15,F_KR,'#9a9aa3');
    txt('필요할지도 모르니까요.',dd.retryHome.x,dd.retryHome.y+12,15,F_KR,'#9a9aa3');
    if(dd.t>4&&Math.abs(dd.retry.x-dd.retryHome.x)<40&&Math.abs(dd.retry.y-dd.retryHome.y)<40)
      txt('(버튼을 옮겨 볼 수도 있습니다)',480,470,13,F_KR,'#55555c');
  }
  // RETRY
  const r=retryRect();
  box(r,'#101013','#cfcfc9',1.5);
  txt('[ RETRY ]',dd.retry.x,dd.retry.y,20,F_MONO,'#ececec');
  txt('DEATHS : '+deaths,480,510,12,F_MONO,'#55555c');
  if(dd.cause==='FIRE'&&!dd.dropped&&dd.t>3)
    txt('빨간 단어를 드래그해서, 설정 창의 비활성화 칸에 놓아 보세요.',480,435,15,F_KR,'#c9c9c2');
}
function drawMenuBtn(b){
  if(b.broken){
    box(b,'#131316','#3a3a42',1.5);
    txt(b.label,b.x+b.w/2,b.y+b.h/2,18,F_MONO,'#55555c');
    ctx.strokeStyle='#55555c';ctx.beginPath();
    ctx.moveTo(b.x+b.w/2-b.label.length*5.4,b.y+b.h/2);
    ctx.lineTo(b.x+b.w/2+b.label.length*5.4,b.y+b.h/2);ctx.stroke();
    ctx.strokeStyle='#2a2a30';ctx.beginPath();
    ctx.moveTo(b.x+b.w*0.2,b.y);ctx.lineTo(b.x+b.w*0.35,b.y+b.h);
    ctx.moveTo(b.x+b.w*0.7,b.y);ctx.lineTo(b.x+b.w*0.62,b.y+b.h);
    ctx.stroke();
  }else{
    const pl=0.55+0.45*Math.sin(gameT*3);
    ctx.save();ctx.globalAlpha=1;
    box(b,'#101013','rgba(236,236,236,'+(0.4+pl*0.6).toFixed(2)+')',2);
    txt(b.label,b.x+b.w/2,b.y+b.h/2,19,F_MONO,'#f0f0ec');
    ctx.restore();
  }
}
function drawMenu(){
  txt('ESC:APE',480,170,120,F_DISP,'#131318','center',1,4);
  txt('main_menu.scene — buttons unresponsive (4 errors)',480,240,11,F_MONO,'#3c3c44');
  ctx.fillStyle='#1d1d21';ctx.fillRect(0,500,960,40);
  ctx.fillStyle='#45454d';ctx.fillRect(0,500,960,2);
  for(const b of MENU_BTNS)drawMenuBtn(b);
  drawPlayer();
  if(confirmOpen){
    ctx.fillStyle='rgba(5,5,6,0.6)';ctx.fillRect(0,0,W,H);
    box({x:300,y:190,w:360,h:160},'#141417','#5a5a64',1.5);
    txt('게임을 종료하시겠습니까?',480,240,19,F_KR,'#ececec');
    box({x:335,y:280,w:120,h:44},'#101013','#cfcfc9',1.5);
    txt('YES',395,302,17,F_MONO,'#ececec');
    box({x:505,y:280,w:120,h:44},'#101013','#4b4b55',1.5);
    txt('NO',565,302,17,F_MONO,'#77777e');
  }
}
function drawOutro(){
  const T=outroT;
  if(T<1){drawMenu();ctx.fillStyle='rgba(5,5,6,'+T.toFixed(2)+')';ctx.fillRect(0,0,W,H);return;}
  ctx.fillStyle='#050506';ctx.fillRect(0,0,W,H);
  const fadeLate=1-fadeIn(T,8.9,0.6);
  if(T>2.6&&fadeLate>0){
    const wx=-30+Math.min(1,(T-2.6)/2.8)*500;
    ctx.save();ctx.globalAlpha=fadeLate;
    ctx.fillStyle='#ececec';
    if(ctx.roundRect){ctx.beginPath();ctx.roundRect(wx,368,14,20,4);ctx.fill();}
    else ctx.fillRect(wx,368,14,20);
    ctx.fillStyle='#151517';ctx.fillRect(wx+8,374,2,3);ctx.fillRect(wx+12,374,2,3);
    ctx.restore();
  }
  txt('게임에서는 탈출했습니다.',480,185,19,F_KR,'#c9c9c2','center',fadeIn(T,4.8,0.8)*fadeLate);
  txt('그런데, 여기도 게임이 아닌가요?',480,222,19,F_KR,'#c9c9c2','center',fadeIn(T,6.8,0.8)*fadeLate);
  const ta=fadeIn(T,9.4,1);
  if(ta>0){
    txt('ESC:APE',480,240,84,F_DISP,'#f0f0ec','center',ta,6);
    txt('LIMITS NOT FOUND',480,308,16,F_MONO,'#8a8a92','center',ta,10);
    const secs=Math.floor((performance.now()-startTime)/1000);
    txt('DEATHS '+deaths+'   ·   TIME '+Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0'),
        480,352,12,F_MONO,'#55555c','center',ta);
    if(T>10)txt('[ 클릭 또는 R — 처음부터 ]',480,404,14,F_KR,'#77777e','center',ta*(0.6+0.4*Math.sin(gameT*3)));
  }
}
function drawHUD(){
  txt('ESC:APE dev_build 0.1   ROOM '+(Math.min(roomIdx,2)+1)+'/3   DEATHS '+deaths,
      14,16,11,F_MONO,'#55555c','left');
  txt('[ESC] SETTINGS   [R] RESTART',W-14,16,11,F_MONO,'#55555c','right');
}
function drawToast(){
  if(gameT>=toastO.until||!toastO.t)return;
  const rem=toastO.until-gameT;
  const a=Math.min(1,rem/0.4)*Math.min(1,(gameT-(toastO.until-6))*4+4);
  ctx.save();ctx.globalAlpha=clamp(a,0,1);
  ctx.font='16px '+F_KR;
  const tw=ctx.measureText(toastO.t).width;
  box({x:480-tw/2-16,y:70,w:tw+32,h:34},'rgba(10,10,12,0.85)','#3a3a42');
  txt(toastO.t,480,87,16,F_KR,'#ececec');
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0b0b0d';ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake*14,(Math.random()-0.5)*shake*14);
  if(state==='play'||state==='dead')drawWorld();
  else if(state==='menu')drawMenu();
  else if(state==='outro')drawOutro();
  ctx.restore();
  if(state==='play'||state==='dead')drawHUD();
  if(state==='dead')drawDead();
  if(S.open&&(state==='play'||state==='dead'))drawPanel();
  if(state==='dead'&&dd&&drag&&drag.type==='cause')drawCauseWord();
  drawToast();
  if(trans){
    const h=trans.dur/2;
    const a=trans.t<h?trans.t/h:1-(trans.t-h)/h;
    ctx.fillStyle='rgba(5,5,6,'+clamp(a,0,1).toFixed(2)+')';
    ctx.fillRect(0,0,W,H);
  }
}

// ---------- loop ----------
let last=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  update(dt);draw();
  requestAnimationFrame(loop);
}
init();
requestAnimationFrame(loop);
</script>
